# How roads are drawn. Edge types are the type ids of OsmGraphCreator's data/configs/all.cfg
# (motorway = 1 ... steps = 22); a road and its link road are one class.
#
#   <class>    <color>   <width px>  <types>
#
# Colors are #RRGGBB or #RRGGBBAA, widths are screen pixels (at most 32). Types no class lists
# belong to the class with "*". Where roads overlap, the class listed first is on top. The
# viewer reloads this file when it is saved.

motorway     #e8768c   4.5   1 2               # motorway, motorway_link
trunk        #f09468   4.0   9 10              # trunk, trunk_link
primary      #f6b55a   3.5   3 4               # primary, primary_link
secondary    #f2dc6b   3.0   5 6               # secondary, secondary_link
tertiary     #e9edf1   2.5   7 8               # tertiary, tertiary_link
minor        #a7b1bf   1.7   11 12 13 14       # unclassified, residential, living_street, road
service      #707b8a   1.2   15 16 17          # service, turning_circle, track
path         #6aa585   0.9   18 19 20 21 22    # pedestrian, footway, cycleway, path, steps
other        #8b919a   1.0   *                 # anything else
